version: '3'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres_rip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
