<!DOCTYPE html>
<html lang="en">
<head>
    <title>Группа продуктов</title>
    <link rel="stylesheet" href="styles/group_product_style.css">
</head>
<body>
<header>
    <h1>
        <a href="/group_product"><img src="http://127.0.0.1:9000/imagegroup/image.png" alt="home"></a>
    </h1>

</header>

<div class="header-section">
    <h2>Группы продуктов</h2>
    <div class="cart">
        <a href="/calculation/{{ .calculationId }}" class="cart-link">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="black">
                <path d="M7 22c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm10 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm1-18h-4.18L14 2H8v2h5.18l-.3 1H4c-1.1 0-2 .9-2 2l-.01 12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12z"/>
            </svg>
            <span class="cart-count">{{ .productsCount }}</span>
        </a>
    </div>
</div>

<form action="/group_product" method="GET" class="search-form">
    <input type="text" name="query" placeholder="Введите название продукта" value="{{ .query }}">
    <button type="submit">Найти</button>
</form>

<div class="cards">
    {{ range .products }}
    <div class="card">

        <div class="card-left">
            <img src="{{ .Image }}" alt="product">
        </div>
        <div class="card-right">
            <h3>{{ .Title }}</h3>
            <a href="/product/{{ .ID }}" class="btn">Подробнее</a>
            <!-- <a href="/cart/add/{{ .ID }}" class="btn add">В корзину</a> -->
            <!-- <a  class="btn add">Добавить</a> -->
            <form action="/calculation/add/product/{{ .ID }}" method="POST">
                <button class="btn add">Добавить</button>
            </form>
        </div>

    </div>
    {{ end }}
</div>
</body>
</html>
